<!DOCTYPE html>
<html>
<head>
    <title>Test Popup Button Handlers</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 8px 16px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Popup Button Handler Test</h1>
    
    <div class="test-section">
        <h2>Button State Management</h2>
        <button id="testButton" data-original-text="Test Button">Test Button</button>
        <div>
            <button onclick="setButtonState('testButton', 'loading')">Set Loading</button>
            <button onclick="setButtonState('testButton', 'success')">Set Success</button>
            <button onclick="setButtonState('testButton', 'error')">Set Error</button>
            <button onclick="setButtonState('testButton', 'idle')">Set Idle</button>
        </div>
    </div>

    <div class="test-section">
        <h2>Error/Success Messages</h2>
        <button onclick="showErrorMessage('This is a test error message')">Show Error</button>
        <button onclick="showSuccessMessage('This is a test success message')">Show Success</button>
    </div>

    <div class="test-section">
        <h2>Async Button Handler Test</h2>
        <button id="asyncTestButton" onclick="testAsyncHandler(event)">Test Async Handler</button>
        <button id="failingButton" onclick="testFailingHandler(event)">Test Failing Handler</button>
    </div>

    <div id="results" class="result">
        <h3>Test Results:</h3>
        <div id="resultContent">Click buttons to test functionality</div>
    </div>

    <script>
        // Mock chrome API for testing
        window.chrome = {
            runtime: {
                sendMessage: function(message) {
                    return new Promise((resolve) => {
                        console.log('Mock chrome.runtime.sendMessage called with:', message);
                        // Simulate different responses based on message type
                        setTimeout(() => {
                            if (message.type === 'CREATE_ROOM') {
                                resolve({ success: true });
                            } else if (message.type === 'FAILING_TEST') {
                                resolve({ success: false, error: 'Simulated failure' });
                            } else {
                                resolve({ success: true });
                            }
                        }, 1000);
                    });
                }
            }
        };

        // Copy the button handling functions from popup implementation
        function setButtonState(buttonId, state) {
            const button = document.getElementById(buttonId);
            if (!button) return;

            // Remove all state classes
            button.classList.remove('btn-loading', 'btn-success', 'btn-error');
            
            // Store original text if not already stored
            if (!button.dataset.originalText) {
                button.dataset.originalText = button.textContent || '';
            }

            switch (state) {
                case 'loading':
                    button.disabled = true;
                    button.classList.add('btn-loading');
                    button.textContent = 'Loading...';
                    break;
                case 'success':
                    button.disabled = false;
                    button.classList.add('btn-success');
                    button.textContent = '✓ Success';
                    break;
                case 'error':
                    button.disabled = false;
                    button.classList.add('btn-error');
                    button.textContent = '✗ Error';
                    break;
                case 'idle':
                default:
                    button.disabled = false;
                    button.textContent = button.dataset.originalText || '';
                    break;
            }
        }

        function showErrorMessage(message) {
            let errorDiv = document.getElementById('error-notification');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.id = 'error-notification';
                errorDiv.className = 'error-notification';
                errorDiv.style.cssText = `
                    padding: 12px 16px;
                    margin: 8px 0;
                    border-radius: 6px;
                    font-size: 14px;
                    font-weight: 500;
                    background-color: #f8d7da;
                    color: #721c24;
                    border: 1px solid #f5c6cb;
                `;
                document.body.insertBefore(errorDiv, document.body.firstChild);
            }

            errorDiv.textContent = message;
            errorDiv.style.display = 'block';

            setTimeout(() => {
                if (errorDiv) {
                    errorDiv.style.display = 'none';
                }
            }, 5000);
        }

        function showSuccessMessage(message) {
            let successDiv = document.getElementById('success-notification');
            if (!successDiv) {
                successDiv = document.createElement('div');
                successDiv.id = 'success-notification';
                successDiv.className = 'success-notification';
                successDiv.style.cssText = `
                    padding: 12px 16px;
                    margin: 8px 0;
                    border-radius: 6px;
                    font-size: 14px;
                    font-weight: 500;
                    background-color: #d4edda;
                    color: #155724;
                    border: 1px solid #c3e6cb;
                `;
                document.body.insertBefore(successDiv, document.body.firstChild);
            }

            successDiv.textContent = message;
            successDiv.style.display = 'block';

            setTimeout(() => {
                if (successDiv) {
                    successDiv.style.display = 'none';
                }
            }, 3000);
        }

        async function handleAsyncButtonClick(event, action) {
            const button = event.target;
            if (!button || button.disabled) return;

            try {
                setButtonState(button.id, 'loading');
                await action();
                setButtonState(button.id, 'success');
                
                setTimeout(() => {
                    setButtonState(button.id, 'idle');
                }, 1000);
            } catch (error) {
                console.error('Async button action failed:', error);
                setButtonState(button.id, 'error');
                showErrorMessage(error.message || 'Operation failed');
                
                setTimeout(() => {
                    setButtonState(button.id, 'idle');
                }, 3000);
            }
        }

        async function testAsyncHandler(event) {
            await handleAsyncButtonClick(event, async () => {
                const response = await chrome.runtime.sendMessage({ type: 'CREATE_ROOM' });
                if (!response.success) {
                    throw new Error(response.error || 'Failed to create room');
                }
                showSuccessMessage('Room created successfully!');
                logResult('Async handler test: SUCCESS - Room creation simulated');
            });
        }

        async function testFailingHandler(event) {
            await handleAsyncButtonClick(event, async () => {
                const response = await chrome.runtime.sendMessage({ type: 'FAILING_TEST' });
                if (!response.success) {
                    throw new Error(response.error || 'Operation failed');
                }
            });
        }

        function logResult(message) {
            const resultContent = document.getElementById('resultContent');
            const timestamp = new Date().toLocaleTimeString();
            resultContent.innerHTML += `<div>[${timestamp}] ${message}</div>`;
        }

        // Add CSS for button states
        const style = document.createElement('style');
        style.textContent = `
            .btn-loading {
                background-color: #6c757d !important;
                cursor: wait !important;
                position: relative;
            }
            
            .btn-loading::after {
                content: '';
                position: absolute;
                width: 16px;
                height: 16px;
                margin: auto;
                border: 2px solid transparent;
                border-top-color: #ffffff;
                border-radius: 50%;
                animation: button-loading-spinner 1s ease infinite;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            @keyframes button-loading-spinner {
                from { transform: translate(-50%, -50%) rotate(0turn); }
                to { transform: translate(-50%, -50%) rotate(1turn); }
            }
            
            .btn-success {
                background-color: #28a745 !important;
                color: white !important;
            }
            
            .btn-error {
                background-color: #dc3545 !important;
                color: white !important;
            }
        `;
        document.head.appendChild(style);

        console.log('Popup button handler test page loaded');
        logResult('Test page initialized - ready for testing');
    </script>
</body>
</html>
