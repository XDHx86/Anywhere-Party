<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Base styles for Material Design 3 */
    * {
      box-sizing: border-box;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #fffbfe;
      color: #1c1b1f;
    }
    
    #options-root {
      min-height: 100vh;
      width: 100%;
    }
    
    /* Loading state */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e7e0ec;
      border-top: 4px solid #6200EE;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 16px;
      color: #49454f;
      font-weight: 500;
    }
    
    /* Skip links for accessibility */
    .skip-links {
      position: absolute;
      top: -40px;
      left: 6px;
      z-index: 1000;
    }
    
    .skip-link {
      position: absolute;
      top: -40px;
      left: 6px;
      background: #6200EE;
      color: white;
      padding: 8px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      transition: top 0.3s;
    }
    
    .skip-link:focus {
      top: 6px;
    }
    
    /* High contrast mode support */
    @media (prefers-contrast: high) {
      html, body {
        background-color: #000000;
        color: #ffffff;
      }
      
      .loading-spinner {
        border-color: #ffffff;
        border-top-color: #ffff00;
      }
    }
    
    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner {
        animation: none;
      }
      
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #100e13;
        color: #e6e1e5;
      }
      
      .loading-spinner {
        border-color: #49454f;
        border-top-color: #d0bcff;
      }
      
      .loading-text {
        color: #cac4d0;
      }
    }
    
    /* Focus management */
    :focus-visible {
      outline: 2px solid #6200EE;
      outline-offset: 2px;
    }
    
    /* Print styles */
    @media print {
      .skip-links,
      .loading-container {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Skip links for keyboard navigation -->
  <div class="skip-links">
    <a href="#options-root" class="skip-link">Skip to main content</a>
  </div>

  <!-- Main application container -->
  <div id="options-root">
    <!-- Loading state (will be replaced by React) -->
    <div class="loading-container">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div class="loading-text">Loading Watch Party Settings...</div>
    </div>
  </div>

  <!-- Fallback integration script (loads first) -->
  <script src="options-fallback.js"></script>
  
  <!-- React application script -->
  <script src="options-react.js"></script>
  
  <!-- Fallback for when JavaScript is disabled -->
  <noscript>
    <div style="padding: 20px; text-align: center; font-family: system-ui, sans-serif;">
      <h1>JavaScript Required</h1>
      <p>This settings page requires JavaScript to function properly.</p>
      <p>Please enable JavaScript in your browser and refresh the page.</p>
    </div>
  </noscript>
</body>
</html>
