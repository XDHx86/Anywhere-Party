# Redis configuration for Watch Party Extension (production)
# Minimal secure defaults — matches dev compose command-line flags

bind 0.0.0.0
port 6379
daemonize no

# Persistence
save 60 1000
appendonly yes

# Memory limits
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security — protected-mode blocks external connections when no password is set
protected-mode yes
