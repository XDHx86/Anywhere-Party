# Security headers — include in every location block that defines its own
# add_header directives, since nginx does NOT inherit server-level headers
# when any add_header is present at location level.
#
# Usage:  include /etc/nginx/conf.d/security-headers.conf;
#
# OWASP-aligned: https://owasp.org/www-project-secure-headers/

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=()" always;
# X-XSS-Protection deprecated per OWASP; disabled to prevent IE-era bypass attacks
add_header X-XSS-Protection "0" always;
