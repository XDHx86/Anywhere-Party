# Nginx configuration for Watch Party Extension
# Hardened per Mozilla Intermediate SSL Profile (2024)
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format — includes timing fields for observability
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60;
    types_hash_max_size 2048;
    server_tokens off;

    # Body/header hardening
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;

    # WebSocket upgrade map — MUST be at http level (not inside server{})
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=websocket:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream servers
    upstream signaling_server {
        least_conn;
        server signaling-server:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream feature_flags {
        server feature-flags:3002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ---- HTTP redirect to HTTPS ----
    server {
        listen 80;
        server_name api.watchparty.example.com;

        # Deliver HSTS on the redirect so browsers cache it from the first hit
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        return 301 https://$server_name$request_uri;
    }

    # ---- Main HTTPS server ----
    server {
        listen 443 ssl http2;
        server_name api.watchparty.example.com;

        # --- TLS (Mozilla Intermediate profile, 2024) ---
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_ecdh_curve      X25519:prime256v1:secp384r1;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/ssl/fullchain.pem;
        resolver            127.0.0.11 valid=300s;
        resolver_timeout    5s;

        # Security headers (server-level; locations that add their own
        # add_header MUST re-include the security-headers snippet)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=()" always;
        add_header X-XSS-Protection "0" always;

        # Hide upstream Server header
        proxy_hide_header Server;

        # Health check endpoint
        location /health {
            proxy_pass http://signaling_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            access_log off;
        }

        # Feature flags API
        location /feature-flags {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://feature_flags;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Re-include security headers (add_header inherits from http, not server,
            # once this location defines its own add_header directives)
            include /etc/nginx/conf.d/security-headers.conf;

            # CORS headers for extension
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://signaling_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-store" always;

            # CORS headers for extension
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # WebSocket connections
        location / {
            limit_req zone=websocket burst=10 nodelay;

            proxy_pass http://signaling_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific settings
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;
            proxy_connect_timeout 60s;

            # Buffer settings for WebSocket
            proxy_buffering off;
            proxy_cache off;
        }

        # Static files (if serving extension files)
        location /static/ {
            root /var/www;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;

            gzip_static on;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            root /usr/share/nginx/html;
        }

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ---- Monitoring endpoints (internal only) ----
    server {
        listen 8080;
        server_name localhost;

        # Restrict access to internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        location /nginx_status {
            stub_status on;
            access_log off;
        }

        location /metrics {
            proxy_pass http://signaling_server/metrics;
            access_log off;
        }
    }
}

# Stream block for TCP/UDP load balancing (TURN server)
stream {
    upstream turn_servers {
        server coturn:3478;
    }

    server {
        listen 3478 udp;
        proxy_pass turn_servers;
        proxy_timeout 1s;
        proxy_responses 1;
    }

    server {
        listen 3478;
        proxy_pass turn_servers;
        proxy_timeout 60s;
    }
}
